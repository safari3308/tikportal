services:
  tikportal:
    image: ghcr.io/safari3308/tikportal:${TIKPORTAL_IMAGE_TAG:-latest}
    container_name: tikportal
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      LISTEN_ADDR: ":8080"
      BASE_URL: "${BASE_URL:-http://localhost:8080}"
      DB_PATH: "${DB_PATH:-/app/data/tikportal.db}"
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET is required in .env}"
      DEFAULT_MAX_PEERS_PER_USER: "${DEFAULT_MAX_PEERS_PER_USER:-5}"
      ADMIN_EMAILS: "${ADMIN_EMAILS:-admin@localhost}"

      # MikroTik RouterOS v7 REST API
      ROUTEROS_MOCK: "${ROUTEROS_MOCK:-false}"
      ROUTEROS_URL: "${ROUTEROS_URL:-https://192.168.88.1}"
      ROUTEROS_USER: "${ROUTEROS_USER:-tikportal-api}"
      ROUTEROS_PASSWORD: "${ROUTEROS_PASSWORD:-}"
      ROUTEROS_INSECURE_SKIP_TLS_VERIFY: "${ROUTEROS_INSECURE_SKIP_TLS_VERIFY:-true}"
      ROUTEROS_INTERFACE_TAG: "${ROUTEROS_INTERFACE_TAG:-tikportal}"
      ROUTEROS_ALLOWED_INTERFACES: "${ROUTEROS_ALLOWED_INTERFACES:-}"

      # OIDC Authentication (Zitadel, Keycloak, Authentik, etc.)
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URL: "${OIDC_REDIRECT_URL:-http://localhost:8080/api/auth/callback}"
      OIDC_SCOPES: "${OIDC_SCOPES:-openid,profile,email}"
      DEV_AUTH_ENABLED: "${DEV_AUTH_ENABLED:-false}"
    volumes:
      - tikportal_data:/app/data

volumes:
  tikportal_data:
